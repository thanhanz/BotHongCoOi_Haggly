name: CI

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  ci:
    name: Build, test, and publish
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: haggly
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d haggly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.201

      - name: Commit lint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          dotnet tool restore

          commits="$(git rev-list --reverse "${BASE_SHA}..${HEAD_SHA}")"
          if [[ -z "${commits}" ]]; then
            echo "No commits found in the pull request range."
            exit 1
          fi

          while IFS= read -r commit; do
            message_file="$(mktemp)"
            git show --format=%B --no-patch "${commit}" > "${message_file}"
            subject="$(sed -n '1p' "${message_file}")"

            if [[ ! "${subject}" =~ ^[a-z]+\([^[:space:]()]+\):\ .+$ ]]; then
              echo "Invalid commit format for ${commit}: ${subject}"
              echo "Expected: <type>(<scope>): <message>"
              rm -f "${message_file}"
              exit 1
            fi

            dotnet commit-lint \
              --commit-file "${message_file}" \
              --commit-message-config-file commit-message-config.json
            rm -f "${message_file}"
          done <<< "${commits}"



      - name: Restore
        run: dotnet restore Haggly.slnx

      - name: Build
        run: dotnet build Haggly.slnx --configuration Release --no-restore

      - name: Apply database migrations
        run: >-
          dotnet ef database update
          --project src/Haggly.Infrastructure/Haggly.Infrastructure.csproj
          --startup-project src/Haggly.Api/Haggly.Api.csproj
          --configuration Release
          --no-build
          --connection "Host=localhost;Port=5433;Database=haggly;Username=postgres;Password=1234"

      - name: Unit tests
        run: >-
          dotnet test tests/Haggly.UnitTests/Haggly.UnitTests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=unit-tests.trx"

      - name: Integration tests
        run: >-
          dotnet test tests/Haggly.IntegrationTests/Haggly.IntegrationTests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=integration-tests.trx"

      - name: Publish
        run: >-
          dotnet publish src/Haggly.Api/Haggly.Api.csproj
          --configuration Release
          --no-build
          --no-restore
          --output ./artifacts/publish

      - name: Upload published API
        uses: actions/upload-artifact@v4
        with:
          name: haggly-api
          path: ./artifacts/publish
          if-no-files-found: error
