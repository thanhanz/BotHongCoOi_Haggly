name: CI

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  ci:
    name: Build, test, and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.201

      - name: Restore
        run: dotnet restore Haggly.slnx

      - name: Build
        run: dotnet build Haggly.slnx --configuration Release --no-restore

      - name: Unit tests
        run: >-
          dotnet test tests/Haggly.UnitTests/Haggly.UnitTests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=unit-tests.trx"

      - name: Integration tests
        run: >-
          dotnet test tests/Haggly.IntegrationTests/Haggly.IntegrationTests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=integration-tests.trx"

      - name: Publish
        run: >-
          dotnet publish src/Haggly.Api/Haggly.Api.csproj
          --configuration Release
          --no-build
          --no-restore
          --output ./artifacts/publish

      - name: Upload published API
        uses: actions/upload-artifact@v4
        with:
          name: haggly-api
          path: ./artifacts/publish
          if-no-files-found: error
