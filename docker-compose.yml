services:
  postgres:
    image: postgres:17
    container_name: haggly-postgres
    environment:
      POSTGRES_DB: haggly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5433:5432"
    volumes:
      - haggly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d haggly"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  haggly-postgres-data:
